name: Checks and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --test update_signature --locked
      - name: Build validation installer without release signing secrets
        run: npm run desktop:build -- --config src-tauri/tauri.checks.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-windows-installer-validation-only
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
