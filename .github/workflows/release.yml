name: Publish Tempo preview

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempo-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == "v$version" ]]
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Verify distribution checksums
        run: |
          cd "downloads/v$VERSION"
          sha256sum --check SHA256SUMS.txt
      - name: Publish prerelease and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --verify-tag \
              --prerelease \
              --title "Tempo $VERSION — versão de teste para Windows" \
              --notes-file "docs/RELEASE-NOTES-v$VERSION.md" \
              "downloads/v$VERSION/Tempo-$VERSION-windows-x64-setup.exe" \
              "downloads/v$VERSION/Tempo-$VERSION-windows-x64-setup.exe.sig" \
              "downloads/v$VERSION/Tempo-$VERSION-windows-x64-portable.zip" \
              "downloads/v$VERSION/SHA256SUMS.txt" \
              "downloads/v$VERSION/latest.json"
          fi
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/tempo-$VERSION"
          cd "$RUNNER_TEMP/tempo-$VERSION"
          sha256sum --check "$GITHUB_WORKSPACE/downloads/v$VERSION/SHA256SUMS.txt"
      - name: Publish update feed after release assets are available
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout -B update-feed origin/main
          node scripts/publish-update-feed.mjs
          git add updates/windows-x64.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish updater feed for v$VERSION"
            git push origin HEAD:main
          fi
