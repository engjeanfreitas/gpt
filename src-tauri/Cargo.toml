[package]
name = "tempo-desktop"
version = "0.1.5"
description = "Rastreador pessoal de tempo para Windows"
authors = ["Tempo contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tempo_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tempo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-autostart", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
